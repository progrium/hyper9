# Temporary (not for merge): diagnoses the macOS hcpu eventfd_waker failure.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: scripts/fetch.sh alpine-amd64 alpine-arm64
      - run: zig build -Doptimize=ReleaseSafe && zig build -Doptimize=ReleaseSafe linux-fixtures
      - run: sysctl -n hw.ncpu 2>/dev/null || nproc
      - run: DIAG_SECS=1200 .github/diag/eventfd.sh
