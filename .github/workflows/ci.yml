# Temporary (not for merge): diagnoses the macOS hcpu munmap hang.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-munmap:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: . scripts/env.sh && scripts/fetch.sh alpine-arm64 alpine-amd64
      - run: sysctl -n hw.ncpu hw.physicalcpu machdep.cpu.brand_string || true
      - run: zig build integration -Doptimize=ReleaseSafe -Darch=arm64 -Dengines=hcpu -Dfilter=no-such-case-zzz
      - run: zig build integration -Doptimize=ReleaseSafe -Darch=amd64 -Dengines=hcpu -Dfilter=no-such-case-zzz
      - run: ls zig-out/bin zig-out/fixtures/linux/arm64 | head -30
      - run: .github/diag/munmap.sh
        env:
          DIAG_SECS: "1200"
