# Publishes the project pages (site/*.html) to GitHub Pages, with the
# browser host (design/0012-browser-host.md) built from main in demo/ as
# the page's live demo.
#
# The demo's root archive needs a 386 root. Building one with
# `zig build mkroot -- --arch 386` cross-compiles the userland on the
# emulator, about an hour on x86_64, so this unpacks the release's 386 ISO
# instead (tools/isoroot.zig). The Linux page's demo runs the same build
# over linux.h9a, Alpine's 386 busybox, jq, and sqlite3
# (src/web/linux.list). The demo page's browser test gates the deploy.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, always the newest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The ISO and v86.wasm change only with scripts/pins.sh.
      - uses: actions/cache@v4
        with:
          path: |
            .local/9front/*.386.iso
            .local/v86
          key: pages-fetch-${{ hashFiles('scripts/pins.sh') }}
      - run: scripts/fetch.sh v86 iso386 alpine386web
      - name: 386 root from the ISO
        run: |
          . scripts/pins.sh
          zig build isoroot -- ".local/9front/9front-$NINEFRONT_RELEASE.386.iso" .local/9front/root386
      - run: zig build web -Doptimize=ReleaseSafe -Dweb-root=.local/9front/root386
      - name: Demo page in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/web/browser.mjs zig-out/web
      - name: Assemble the site
        run: |
          mkdir -p _site/demo
          cp site/*.html _site/
          cp zig-out/web/{index.html,h9-web.js,worker.js,wasi-mem.js,h9.wasm,v86.wasm,root.h9a,linux.h9a,package.json,LICENSE.v86} _site/demo/
          cp LICENSE _site/demo/LICENSE
          cp third_party/drawterm/LICENSE _site/demo/LICENSE.drawterm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
