<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h9 in the browser</title>
<!-- No favicon request, whose 404 desktop Chrome logs as an error. -->
<link rel="icon" href="data:,">
<style>
  :root { --bg: #fdfdf6; --fg: #1d1d1d; --dim: #6b6b6b; --accent: #2a5db0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e8e8e0; --dim: #9a9a9a; --accent: #7aa7ee; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 8px 16px; color: var(--dim); border-bottom: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); }
  header button { font: inherit; margin-left: 8px; }
  #term { flex: 1; overflow: auto; margin: 0; padding: 8px 16px; white-space: pre-wrap; word-break: break-all; outline: none; }
  #term .cursor { background: var(--accent); color: var(--bg); }
  #term.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
  /* Takes the keyboard input, so a tap on the terminal brings up a phone's
     on-screen keyboard, which a <pre> can't. Invisible, and 16px so iOS
     doesn't zoom when it's focused. */
  /* ?rio: the screen, in CSS pixels' worth of device pixels. */
  #screen { flex: 1; min-height: 0; width: 100%; display: block; outline: none; background: #777; }
  /* ?wine: the Wine desktop's own size. */
  #screen.wine { flex: 0 0 auto; width: 1024px; height: 768px; margin: 8px auto; }
  #kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; resize: none; caret-color: transparent; }
</style>
</head>
<body>
<header><span id="about">h9: 9front's 386 programs in a Web Worker. Type to rc;</span> <span id="rcnote"><button id="intr">interrupt</button> or Ctrl-C stops a command.</span> <button id="rio">rio</button></header>
<pre id="term" tabindex="-1" aria-hidden="true"></pre>
<textarea id="kbd" aria-label="terminal input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<script type="module">
import { createMachine, haveJSPI } from './h9-web.js';

const term = document.getElementById('term');
const dec = new TextDecoder();
let out = '';       // everything printed
let line = '';      // the line being typed, in cooked mode
let raw = false;
let composing = ''; // text an on-screen keyboard is still composing

const render = () => {
  term.textContent = out + (raw ? '' : line) + composing;
  const c = document.createElement('span');
  c.className = 'cursor';
  c.textContent = ' ';
  term.append(c);
  term.scrollTop = term.scrollHeight;
};
const print = (s) => {
  for (const ch of s.replace(/\r\n?/g, '\n')) {
    if (ch === '\b') out = out.slice(0, -1);
    else out += ch;
  }
  render();
};

if (!haveJSPI) {
  print('This browser lacks JavaScript Promise Integration, which h9 needs (Chrome 137 or later).\n');
} else {
  // ?root=ws://host/9p runs over a 9P server instead of root.h9a,
  // ?linux runs Alpine's arm64 busybox sh over linux.h9a, a Linux root
  // (design/0018-linux-personality.md), on ha64, h9's own arm64 CPU.
  // ?backend= picks the backend (emu, h9's own CPUs, is the only one; v86
  // is its old name).
  const params = new URLSearchParams(location.search);
  const linux = params.has('linux');
  // ?rio runs rio with acme in a canvas (design/0120-browser-gfx.md).
  document.getElementById('rio').onclick = () => { location.search = params.has('rio') ? '' : '?rio'; };
  if (params.has('rio')) await runRio(params);
  else if (params.has('wine')) await runWine(params);
  else {
    if (linux) document.getElementById('about').textContent = "h9: Alpine Linux's arm64 programs in a Web Worker. Type to busybox sh;";
    const m = await createMachine({
      root: linux ? 'linux.h9a' : params.get('root') ?? undefined,
      arch: linux ? 'arm64' : undefined,
      backend: params.get('backend') ?? undefined,
      terminal: { write: (b) => print(dec.decode(b, { stream: true })), setRaw: (on) => { raw = on; render(); } },
    });
    const kbd = document.getElementById('kbd');
    // Sends what was typed: in raw mode as it is, in cooked mode through the
    // page's line editing, which echoes it, as a host terminal would, and
    // sends each line whole.
    const send = (s) => {
      if (raw) { m.input(s); return; }
      for (const ch of s) {
        if (ch === '\b') line = line.slice(0, -1);
        else if (ch === '\n') { out += line + '\n'; m.input(line + '\n'); line = ''; }
        else line += ch;
      }
      render();
    };
    const interrupt = () => { m.interrupt(); if (!raw) { line = ''; print('\n'); } };
    document.getElementById('intr').onclick = () => { interrupt(); kbd.focus(); };
    // A click gives the keyboard to the input, unless it made a selection,
    // which stays so it can be copied. (Moving focus on mousedown would clear
    // it.) Typing with the terminal focused goes to the input, except a copy.
    const selected = () => !!getSelection()?.toString();
    term.addEventListener('click', () => { if (!selected()) kbd.focus(); });
    term.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && selected()) return;
      kbd.focus();
      onKey(e);
    });
    const onKey = (e) => {
      if (e.metaKey || e.isComposing || (e.ctrlKey && e.key === 'v')) return;
      let s = null;
      if (e.ctrlKey && e.key.length === 1) {
        const k = e.key.toLowerCase();
        if (k === 'c' && !raw) { interrupt(); e.preventDefault(); return; }
        if (k === 'd' && !raw) { m.input(line + '\x04'); line = ''; render(); e.preventDefault(); return; }
        s = String.fromCharCode(k.charCodeAt(0) - 96);
      } else if (e.key === 'Enter') s = '\n';
      else if (e.key === 'Backspace') s = '\b';
      else if (e.key === 'Tab') s = '\t';
      else if (e.key === 'Escape') s = '\x1b';
      else if (e.key.length === 1) s = e.key;
      // Anything else, such as the "Unidentified" keys on-screen keyboards
      // report, arrives as an input event instead.
      if (s === null) return;
      e.preventDefault();
      send(s);
    };
    kbd.addEventListener('keydown', onKey);
    // On-screen keyboards insert text rather than sending keys. The textarea
    // keeps one space, so a backspace has something to delete and shows up
    // as a shorter value; what's typed is whatever follows the space. Text
    // still being composed (word prediction) waits for compositionend.
    const pad = ' ';
    const reset = () => { kbd.value = pad; kbd.setSelectionRange(1, 1); };
    const typed = () => {
      const v = kbd.value;
      reset();
      if (v.length < pad.length) return '\b';
      return (v.startsWith(pad) ? v.slice(pad.length) : v).replace(/\r\n?/g, '\n');
    };
    kbd.addEventListener('input', (e) => {
      if (e.isComposing) { composing = kbd.value.slice(pad.length); render(); return; }
      const s = typed();
      if (s) send(s);
    });
    kbd.addEventListener('compositionend', () => {
      composing = '';
      const s = typed();
      if (s) send(s); else render();
    });
    kbd.addEventListener('paste', (e) => {
      e.preventDefault();
      send(e.clipboardData.getData('text').replace(/\r\n?/g, '\n'));
    });
    // Files dropped on the page go into the root's tree in the shell's home
    // (machine._put), and their paths are typed, as a host terminal types
    // a dropped file's path. A program or script is made executable.
    const home = linux ? '/root' : '/usr/glenda';
    const quote = (p) => /^[\w./+,:@%=-]+$/.test(p) ? p : linux ? `'${p.replaceAll("'", "'\\''")}'` : `'${p.replaceAll("'", "''")}'`;
    const runnable = (b) => (b[0] === 0x7f && b[1] === 0x45 && b[2] === 0x4c && b[3] === 0x46) || (b[0] === 0x23 && b[1] === 0x21);
    // A ws:// root's tree isn't the Worker's, so there's nowhere to put them.
    const remote = /^wss?:/i.test(params.get('root') ?? '');
    const hasFiles = (e) => !remote && e.dataTransfer?.types.includes('Files');
    document.addEventListener('dragover', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      term.classList.add('drop');
    });
    document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) term.classList.remove('drop'); });
    document.addEventListener('drop', async (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      term.classList.remove('drop');
      const paths = [];
      for (const f of e.dataTransfer.files) {
        // A dropped folder has no bytes to read, and is left out.
        const b = await f.arrayBuffer().then((a) => new Uint8Array(a), () => null);
        if (!b) continue;
        const name = f.name.replaceAll('/', '_');
        m._put(`${home.slice(1)}/${name}`, b, runnable(b) ? 0o755 : 0o644);
        paths.push(quote(`${home}/${name}`));
      }
      if (paths.length) send(paths.join(' ') + ' ');
      kbd.focus();
    });
    reset();
    kbd.focus();
    render();
    // The archive keeps no links, so busybox makes its applets' links at
    // the start, in the root's overlay.
    const argv = linux ? ['/bin/busybox', 'sh', '-c', '/bin/busybox --install -s 2>/dev/null; cd /root; exec sh -i'] : ['rc', '-i'];
    const code = await m.run(argv).catch((e) => { print(`\n${e.message}\n`); return null; });
    if (code !== null) print(`\n[h9 exited ${code}]\n`);
  }
}

// Wine's own classic programs on a Windows desktop, on a canvas
// (site/wine.html): 32-bit Wine over wine.h9a, an Alpine 386 root with
// Wine, its display driver for draw (design/wine-draw.md) and a prefix made
// ahead of time (scripts/wine-web.sh). The desktop is 1024x768, the size
// the prefix's Wine desktop is set to. ?memory= sets --memory.
async function runWine(params) {
  document.getElementById('about').textContent = "h9: 32-bit Wine on Alpine Linux in a Web Worker. Wine's desktop takes a minute or so to come up; then double-click an icon.";
  document.getElementById('rcnote').hidden = true;
  document.getElementById('rio').hidden = true;
  const canvas = document.createElement('canvas');
  canvas.id = 'screen';
  canvas.className = 'wine';
  term.before(canvas);
  term.style.flex = '0 0 auto';
  term.style.maxHeight = '20vh';
  const m = await createMachine({
    root: 'wine.h9a',
    memory: params.get('memory') ?? '768M',
    gfx: { canvas, scale: 1 },
    terminal: { write: (b) => print(dec.decode(b, { stream: true })) },
    // Without the wasm JIT tier: with it, 32-bit Wine computes a DPI of
    // 0 and gets garbled bytes from some reads, and draws nothing. ?jit
    // turns it back on.
    env: params.has('jit') ? undefined : { H9_JIT_HOT: '4000000000' },
  });
  canvas.focus();
  // The archive keeps no links: busybox makes its applets', and the
  // prefix's C: and Z: drives are made here, in the root's overlay.
  // ?start= names the program to open first, one of Wine's: a bare name.
  const start = /^[a-z0-9]+$/.test(params.get('start') ?? '') ? params.get('start') : 'winemine';
  const script = [
    '/bin/busybox --install -s 2>/dev/null',
    'ln -sfn ../drive_c /root/.wine/dosdevices/c:',
    'ln -sfn / /root/.wine/dosdevices/z:',
    'cd /root',
    `/usr/bin/wine ${start} &`,
    // A day at a time: a sleep past 2^31 ms would wake at once, and keep
    // the CPU busy.
    'while :; do sleep 86400; done',
  ].join('\n');
  const env = ['HOME=/root', 'PATH=/usr/bin:/bin', 'WINEPREFIX=/root/.wine', 'WINEDEBUG=-all',
    'LD_PRELOAD=/usr/lib/wine/i386-unix/roundf386.so'];
  const argv = [...env.flatMap((e) => ['--env', e]), '/bin/busybox', 'sh', '-c', script];
  const code = await m.run(argv).catch((e) => { print(`\n${e.message}\n`); return null; });
  if (code !== null) print(`\n[h9 exited ${code}]\n`);
}

// rio, with acme in a window, on a canvas in place of the terminal. The
// console's output, if any, goes below it. Click the canvas to type to it;
// Ctrl-V (Cmd-V) puts the page's clipboard in the snarf buffer, for rio's
// or acme's own paste, and a snarf in the guest copies to the clipboard.
async function runRio(params) {
  document.getElementById('about').textContent = "h9: 9front's rio and acme in a Web Worker. Click to type; Ctrl-V fills the snarf buffer, then paste with button 2.";
  document.getElementById('rcnote').hidden = true;
  document.getElementById('rio').textContent = 'rc';
  const hang = document.createElement('button');
  hang.textContent = 'hang up';
  document.querySelector('header').append(' ', hang);
  const canvas = document.createElement('canvas');
  canvas.id = 'screen';
  term.before(canvas);
  term.style.flex = '0 0 auto';
  term.style.maxHeight = '20vh';
  const scale = Number(params.get('scale') ?? 1);
  const m = await createMachine({
    gfx: { canvas, scale },
    terminal: { write: (b) => print(dec.decode(b, { stream: true })) },
  });
  hang.onclick = () => m.hangup();
  m.addEventListener('snarf', (e) => print(`[the clipboard refused the snarf buffer: ${JSON.stringify(e.text)}]\n`));
  canvas.focus();
  const cmd = params.get('cmd') ?? 'window acme';
  const code = await m.run(['rio', '-i', cmd]).catch((e) => { print(`\n${e.message}\n`); return null; });
  if (code !== null) print(`\n[h9 exited ${code}]\n`);
}
</script>
</body>
</html>
